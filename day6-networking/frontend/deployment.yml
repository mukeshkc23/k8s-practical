apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment
  namespace: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:

    metadata:
      labels:
        app: frontend

    spec:

      containers:

        - name: nginx

          image: nginx:1.27

          ports:
            - containerPort: 80

          volumeMounts:

            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf

      volumes:

        - name: nginx-config

          configMap:
            name: frontend-nginx-config