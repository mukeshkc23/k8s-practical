apiVersion: apps/v1
kind: Deployment

metadata:
  name: health-app
  namespace: dev

spec:

  replicas: 2

  selector:
    matchLabels:
      app: health-app

  template:

    metadata:
      labels:
        app: health-app

    spec:

      containers:

        - name: flask

          image: k8s-health:v1

          ports:
            - containerPort: 5000

          resources:

            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          startupProbe:

            httpGet:
              path: /startup
              port: 5000

            periodSeconds: 2
            failureThreshold: 15

          livenessProbe:

            httpGet:
              path: /health
              port: 5000

            initialDelaySeconds: 5
            periodSeconds: 5

          readinessProbe:

            httpGet:
              path: /ready
              port: 5000

            initialDelaySeconds: 5
            periodSeconds: 5