apiVersion: batch/v1
kind: Job
metadata:
  name: completion-job
  namespace: dev
spec:
  completions: 3
  parallelism: 3
  backoffLimit: 2

  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Worker started"
              sleep 5
              echo "Worker completed"