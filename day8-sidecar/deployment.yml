apiVersion: apps/v1
kind: Deployment

metadata:
  name: sidecar-app
  namespace: dev

spec:

  replicas: 2

  selector:
    matchLabels:
      app: sidecar-app

  template:

    metadata:
      labels:
        app: sidecar-app

    spec:

      containers:

        # -----------------------
        # Flask Application
        # -----------------------

        - name: flask

          image: k8s-sidecar:v1

          ports:
            - containerPort: 5000

          volumeMounts:

            - name: shared-logs
              mountPath: /shared


        # -----------------------
        # Sidecar Container
        # -----------------------

        - name: log-sidecar

          image: busybox:1.36

          command:

            - /bin/sh
            - -c

          args:

            - |
              touch /shared/application.log
              echo "Log sidecar started"
              tail -f /shared/application.log

          volumeMounts:

            - name: shared-logs
              mountPath: /shared


      # -----------------------
      # Shared Volume
      # -----------------------

      volumes:

        - name: shared-logs

          emptyDir: {}