apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stateful-app
  namespace: dev
spec:
  serviceName: stateful-service
  replicas: 3

  selector:
    matchLabels:
      app: stateful-app

  template:
    metadata:
      labels:
        app: stateful-app

    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80

          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html/data

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 1Gi